<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P4-Architecture School</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap" rel="stylesheet">

    <style>

        body{
            font-size: 16px;
            font-family: "Roboto Mono", monospace;
            background-color: var(--neutral-b-color);

        }


        :root{
            --primary-color:#00ff11;
            --secondary-color:#00FF92;
            --neutral-b-color:#00663a;
            --neutral-w-color:#99ffd3;


        }

        h1:nth-child(1){
            font-size: 1.5em;
            color: var(--primary-color);
            border: 0.1em  solid var(--primary-color);
            margin: 2% 10% 2% 10%;
            text-align: center;
            padding: 1% 0% 1% 0%;
            animation: parpadeo 2s ease-in-out infinite;
        }

        h1:nth-child(2){
            font-size: 1.5em;
            color: var(--primary-color);
            border: 0.1em  solid var(--primary-color);
            margin: 2% 20% 2% 20%;
            text-align: center;
            padding: 1% 0% 1% 0%;
            animation: parpadeo 2s ease-in-out infinite;
        }

        h1:nth-child(3){
            font-size: 1.5em;
            color: var(--primary-color);
            border: 0.1em  solid var(--primary-color);
            margin: 2% 30% 2% 30%;
            text-align: center;
            padding: 1% 0% 1% 0%;
            animation: parpadeo 2s ease-in-out infinite;
        }

        @keyframes parpadeo {
        0%, 100% {
            opacity: 1;
            box-shadow: 0 5px 10px var(--primary-color);
            text-shadow: 0 0 6px var(--primary-color);
        }
        50% {
            opacity: 0.6;
            box-shadow: 0 0px 3px var(--primary-color);
            text-shadow: 0 0 2px var(--primary-color);
        }
        }

        h2{
            background-color:var(--secondary-color);
            opacity: 50%;
            margin: 0 10% 0% 10%;
            text-align: center;
            padding: 17%;
            height: 150px;
            animation: aumento 5s ease-in-out infinite;
            border-radius: 5%;
            color: var(--neutral-b-color);
        }

        @keyframes aumento {
            0%, 100% {
               font-size: 0.5em;
            }
            50%{
                font-size: 5em;
            }
        }

        li{
            margin: 30px 30px 0px 30px;
            width: 100px;
            height: 100px;
            background-color: #00FF92;
            border-radius: 50%;
            display: flex;
            text-align: center;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .alumnos{
            list-style: none;
            display: flex;
            justify-content: center;
        }

        h3{
            text-align: center;
            background-color: var(--neutral-w-color);
            margin: 0px 80px 20px 80px;
            color: var(--neutral-b-color);
            padding: 30px 0px 30px 0;
        }

    </style>
</head>
<body>
    <header>
        <hgroup>
            <h1>Luz 1</h1>
            <h1>Luz 2</h1>
            <h1>Luz 3</h1>
        </hgroup>
    </header>

    <main>
        <section>
            <h2>Pizarra</h2>
        </section>
        <section>
            <ul class="alumnos">
                <li>Lucia</li>
                <li>Gabriel</li>
                <li>Alvaro</li>
                <li>Lara</li>
                <li>Arhian</li>
                <li>Sara</li>
                <li>Judith</li>
            </ul>
            <h3>Mesa 1</h3>
        </section>

        <section>
            <ul class="alumnos">
                <li>Mateo</li>
                <li>Eva</li>
                <li>Tomas</li>
                <li>Leyre</li>
                <li>Mariola</li>
                <li>Luna</li>
                <li>Cynthia</li>
            </ul>
            <h3>Mesa 2</h3>
        </section>

        <section>
            <ul class="alumnos">
                <li>David</li>
                <li>Guillem</li>
                <li>Angels</li>
                <li>Martina</li>
                <li>Teresa</li>
                <li>Sergio</li>
                <li>Diana</li>
            </ul>
            <h3>Mesa 3</h3>
        </section>
    </main>
</body>
</html>
